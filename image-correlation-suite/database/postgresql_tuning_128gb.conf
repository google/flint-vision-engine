# ===============================================================================
# SYMPICS FORENSIC DATABASE - POSTGRESQL 16 HIGH-PERFORMANCE TUNING
# ===============================================================================
# Target Hardware Profile:
#  • CPU: AMD Ryzen Threadripper / High-Core Xeon (16-32 Cores / 24-64 Threads)
#  • RAM: 128 GB DDR4/DDR5
#  • Storage: NVMe PCIe 4.0/5.0 SSDs
#  • Workload: pgvector HNSW High-Dimensional Vector Search + Ingestion
# ===============================================================================

# 1. MEMORY CONFIGURATION (Tuned for 128 GB RAM)
# -------------------------------------------------------------------------------
# 25% of total system RAM for shared buffer pool (keeps active HNSW index pages in RAM)
shared_buffers = 32GB

# Memory available per query sort/hash operation
work_mem = 64MB

# Memory allocated for index building (HNSW index build uses this memory)
maintenance_work_mem = 4GB

# Estimated memory available for OS disk cache (typically 50-75% of total RAM)
effective_cache_size = 80GB

# 2. CPU CONCURRENCY & PARALLEL WORKERS
# -------------------------------------------------------------------------------
# Maximum background workers system-wide
max_worker_processes = 24

# Maximum parallel workers for complex query execution
max_parallel_workers = 16

# Maximum parallel workers during CREATE INDEX / REINDEX operations
max_parallel_maintenance_workers = 6

# Maximum parallel workers per Gather / Gather Merge node
max_parallel_workers_per_gather = 4

# 3. NVME DISK I/O & PLANNER OPTIMIZATION
# -------------------------------------------------------------------------------
# Random page access cost (1.1 for high-speed NVMe PCIe 4.0/5.0 SSDs)
random_page_cost = 1.1

# Sequential page scan cost baseline
seq_page_cost = 1.0

# Number of concurrent disk I/O operations supported simultaneously
effective_io_concurrency = 200

# 4. WRITE-AHEAD LOG (WAL) & INGESTION THROUGHPUT
# -------------------------------------------------------------------------------
# Maximizes write throughput during high-speed batch evidence ingestion
wal_buffers = 64MB
min_wal_size = 2GB
max_wal_size = 16GB
checkpoint_completion_target = 0.9

# 5. PGVECTOR HNSW QUERY OPTIMIZATIONS
# -------------------------------------------------------------------------------
# Size of the dynamic candidate list for HNSW vector search (higher = higher recall)
# Default is 40. Setting to 100 provides 99.5%+ recall with <50ms query time.
# SET hnsw.ef_search = 100;
